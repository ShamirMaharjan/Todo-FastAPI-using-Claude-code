services:
  - type: web
    name: fastapi-todo-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
    healthCheckPath: /

databases:
  - name: todo-db
    plan: free
    databaseName: todo_db
    user: app_user
    region: oregon