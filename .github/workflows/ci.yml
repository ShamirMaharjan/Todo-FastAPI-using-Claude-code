name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: todo_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Ruff formatting check
        run: ruff format --check .

      - name: Run Mypy type checking
        run: mypy app/

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
        env:
          DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/todo_db
          SYNC_DATABASE_URL: postgresql://app_user:app_password@localhost:5432/todo_db
          SECRET_KEY: test_secret_key
